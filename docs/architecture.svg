<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<style>
.box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}
.group{fill:#eef6ff;stroke:#2563eb;stroke-width:2;rx:18;opacity:.95}
.group2{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:18;opacity:.95}
.group3{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:18;opacity:.95}
.group4{fill:#faf5ff;stroke:#9333ea;stroke-width:2;rx:18;opacity:.95}
.txt{font-family:Arial, sans-serif;font-size:18px;fill:#0f172a}
.title{font-family:Arial, sans-serif;font-weight:bold;font-size:24px;fill:#0f172a}
.small{font-family:Arial, sans-serif;font-size:14px;fill:#334155}
.arrow{stroke:#0f172a;stroke-width:2;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0f172a"/></marker></defs>
<text x="360" y="40" class="title">5G Security Testing for Autonomous Mining Vehicles - Architecture</text>

<rect x="40" y="80" width="390" height="230" class="group"/>
<text x="70" y="115" class="title">5G Control Plane</text>
