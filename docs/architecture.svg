<rect x="630" y="450" width="130" height="60" class="box"/><text x="648" y="486" class="txt">Alertmanager</text>
<rect x="360" y="540" width="170" height="60" class="box"/><text x="390" y="576" class="txt">Evidence</text><text x="378" y="596" class="small">logs/pcaps/CSV</text>

<rect x="870" y="390" width="300" height="160" class="group"/>
<text x="900" y="425" class="title">Internal Attacker</text>
