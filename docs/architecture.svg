<rect x="1110" y="145" width="160" height="70" class="box"/><text x="1133" y="176" class="txt">MEC API</text><text x="1126" y="198" class="small">tamper/replay/ML</text>
<rect x="1110" y="235" width="160" height="50" class="box"/><text x="1130" y="267" class="txt">ML Artifacts</text>

<rect x="230" y="390" width="560" height="230" class="group4"/>
