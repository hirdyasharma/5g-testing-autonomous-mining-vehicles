<line x1="725" y1="190" x2="410" y2="480" class="arrow"/>
<line x1="410" y1="480" x2="450" y2="480" class="arrow"/>
<line x1="600" y1="480" x2="630" y2="480" class="arrow"/>
<line x1="1010" y1="455" x2="1190" y2="215" class="arrow"/>
<line x1="1010" y1="455" x2="650" y2="225" class="arrow"/>
<line x1="1010" y1="515" x2="445" y2="540" class="arrow"/>
<text x="80" y="700" class="txt">Flow: UERANSIM/Open5GS simulate 5G planes → Telemetry simulator sends vehicle data → MEC validates and scores → Prometheus scrapes → Grafana visualises → Kali generates controlled lab-only tests → evidence is exported.</text>
