<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<style>
.box{fill:#f8fafc;stroke:#1e293b;stroke-width:2;rx:14;ry:14}.plane{fill:#e0f2fe;stroke:#0369a1;stroke-width:2;rx:18;ry:18}.sec{fill:#fee2e2;stroke:#b91c1c}.mon{fill:#dcfce7;stroke:#15803d}.test{fill:#fef3c7;stroke:#a16207}text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:26px;font-weight:700}.h{font-size:17px;font-weight:700}.t{font-size:14px}.arrow{stroke:#334155;stroke-width:2.4;fill:none;marker-end:url(#m)}.dash{stroke-dasharray:6 5}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<text x="30" y="42" class="title">5G Security Testing for Autonomous Mining Vehicles — MQTT-Based Testbed</text>
<rect x="30" y="80" width="230" height="150" class="plane"/><text x="50" y="112" class="h">Vehicle Simulation</text><text x="50" y="145" class="t">Physics / Scenario Simulator</text><text x="50" y="172" class="t">MQTT Telemetry Publisher</text><text x="50" y="199" class="t">Fallback HTTP telemetry</text>
<rect x="320" y="70" width="260" height="190" class="plane"/><text x="340" y="102" class="h">Simulated 5G Environment</text><text x="340" y="135" class="t">UERANSIM UE(s) + gNB</text><text x="340" y="162" class="t">Open5GS AMF / SMF / UPF</text><text x="340" y="189" class="t">NRF / AUSF / UDM / UDR / PCF</text><text x="340" y="216" class="t">MongoDB subscribers</text>
<rect x="30" y="310" width="270" height="130" class="box"/><text x="50" y="342" class="h">MQTT Telemetry Ingestion</text><text x="50" y="375" class="t">Mosquitto MQTT Broker</text><text x="50" y="402" class="t">MQTT-to-MEC Bridge</text><text x="50" y="429" class="t">Bridge metrics on Prometheus</text>
<rect x="370" y="310" width="280" height="160" class="sec"/><text x="392" y="342" class="h">MEC / Security Plane</text><text x="392" y="375" class="t">MEC Edge Security API</text><text x="392" y="402" class="t">Tamper / replay-like checks</text><text x="392" y="429" class="t">Achani ML model outputs</text><text x="392" y="456" class="t">JSON/CSV events</text>
<rect x="720" y="300" width="290" height="180" class="mon"/><text x="742" y="332" class="h">Monitoring + Evidence</text><text x="742" y="365" class="t">Prometheus metrics</text><text x="742" y="392" class="t">Grafana dashboards</text><text x="742" y="419" class="t">Alertmanager + Node Exporter</text><text x="742" y="446" class="t">Logs / PCAPs / screenshots</text>
<rect x="720" y="80" width="300" height="150" class="test"/><text x="742" y="112" class="h">Controlled Lab Testing</text><text x="742" y="145" class="t">Internal Kali attacker</text><text x="742" y="172" class="t">nmap / hping3 / curl</text><text x="742" y="199" class="t">mosquitto_pub / tcpdump</text>
<rect x="70" y="550" width="1060" height="130" class="box"/><text x="95" y="584" class="h">Final Demo Evidence Chain</text><text x="95" y="618" class="t">Normal MQTT telemetry → controlled Kali test or MQTT tamper → MEC validation → Prometheus metrics → Grafana visual proof → evidence folder with logs, events, PCAPs, and screenshots</text><text x="95" y="650" class="t">Scope: simulated 5G/MEC cybersecurity prototype; all testing is local, controlled, and lab-only.</text>
